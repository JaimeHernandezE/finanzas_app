name: Tareas inicio de mes

# Día 1 de cada mes a las 06:00 UTC ≈ 02:00 America/Santiago cuando el offset es UTC−4.
# Con UTC−3 suele corresponder a ~03:00 local (desfase de una hora al cambiar horario; GitHub solo permite cron UTC).
# Solo copia presupuestos (personal + familiar) al mes en curso. El recálculo de snapshots
# no corre aquí: se mantiene al guardar movimientos.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  rollover-presupuestos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: finanzas_app/backend
        run: pip install --quiet -r requirements.txt

      - name: Validar secrets mínimos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta secret DATABASE_URL"
            exit 1
          fi
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Falta secret SECRET_KEY"
            exit 1
          fi

      - name: Copiar presupuestos al mes actual
        working-directory: finanzas_app/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
        run: python manage.py recalculo_mensual_admin_tz
